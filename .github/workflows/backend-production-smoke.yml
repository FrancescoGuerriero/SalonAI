name: Backend Production Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-backend-build:
    name: Production backend image build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build production backend image
        run: docker build --file backend/Dockerfile.production --tag salonai-backend:production-smoke backend
