name: Point 8B Campaign Hub Gate

on:
  pull_request:
    paths:
      - "backend/src/features/campaigns/**"
      - "backend/src/features/reputation/**"
      - "backend/src/features/customerExperience/stage4CustomerExperienceService.js"
      - "backend/src/features/integrationPlatform/marketingAccountVerificationService.js"
      - "backend/src/features/integrationPlatform/marketingConnectedAccountsController.js"
      - "backend/src/features/integrationPlatform/marketingConnectedAccountsRoutes.js"
      - "backend/src/features/integrationPlatform/marketingVerifiedConnectorsService.js"
      - "backend/src/features/integrationPlatform/marketingHubProviderExtensions.js"
      - "backend/src/features/integrationPlatform/providerCredentialService.js"
      - "backend/src/features/leads/leadController.js"
      - "backend/src/services/socialPublishingWorkerService.js"
      - "backend/src/test/point6CampaignAttributionContracts.test.js"
      - "backend/src/test/point6SocialReputationPerformanceContracts.test.js"
      - "backend/src/test/stage8bCampaignHubLocationContracts.test.js"
      - "backend/src/test/stage8MarketingRealConnectorContracts.test.js"
      - "frontend/src/Services/marketingConnectionsService.js"
      - "frontend/src/pages/MarketingHubPage.jsx"
      - "docs/roadmap/stage-8b-campaign-hub-completion.md"
      - "docs/roadmap/stage-8-marketing-real-connectors.md"
      - ".github/workflows/point8b-campaign-hub.yml"
  push:
    branches:
      - main
    paths:
      - "backend/src/features/campaigns/**"
      - "backend/src/features/reputation/**"
      - "backend/src/features/customerExperience/stage4CustomerExperienceService.js"
      - "backend/src/features/integrationPlatform/marketingAccountVerificationService.js"
      - "backend/src/features/integrationPlatform/marketingConnectedAccountsController.js"
      - "backend/src/features/integrationPlatform/marketingConnectedAccountsRoutes.js"
      - "backend/src/features/integrationPlatform/marketingVerifiedConnectorsService.js"
      - "backend/src/features/integrationPlatform/marketingHubProviderExtensions.js"
      - "backend/src/features/integrationPlatform/providerCredentialService.js"
      - "backend/src/features/leads/leadController.js"
      - "backend/src/services/socialPublishingWorkerService.js"
      - "backend/src/test/point6CampaignAttributionContracts.test.js"
      - "backend/src/test/point6SocialReputationPerformanceContracts.test.js"
      - "backend/src/test/stage8bCampaignHubLocationContracts.test.js"
      - "backend/src/test/stage8MarketingRealConnectorContracts.test.js"
      - "frontend/src/Services/marketingConnectionsService.js"
      - "frontend/src/pages/MarketingHubPage.jsx"
      - "docs/roadmap/stage-8b-campaign-hub-completion.md"
      - "docs/roadmap/stage-8-marketing-real-connectors.md"
      - ".github/workflows/point8b-campaign-hub.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Point 8B location-owned campaign and real connector contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run campaign, reputation and Marketing Hub contracts
        run: >-
          node --test
          src/test/point6CampaignAttributionContracts.test.js
          src/test/point6SocialReputationPerformanceContracts.test.js
          src/test/stage8bCampaignHubLocationContracts.test.js
          src/test/stage8MarketingRealConnectorContracts.test.js

      - name: Verify backend source
        run: npm run check

      - name: Verify application imports
        run: node -e "import('./src/app.js').then(() => console.log('Backend import OK'))"