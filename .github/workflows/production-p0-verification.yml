name: SalonAI Production P0 Verification

on:
  workflow_dispatch:
    inputs:
      expected_release_tag:
        description: Expected production release tag
        required: true
        default: v8.15.5
        type: string

permissions:
  contents: read

concurrency:
  group: salonai-production-p0-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production P0 data state
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate expected release tag input
        shell: bash
        env:
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Configure strict SSH transport
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in             PRODUCTION_HOST             PRODUCTION_USER             PRODUCTION_SSH_KEY             PRODUCTION_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production secret is missing: $name" >&2
              exit 1
            fi
          done

          [[ "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_USER" == "salonai-deploy" ]]

          ssh_directory="$RUNNER_TEMP/salonai-ssh"
          install -d -m 0700 "$ssh_directory"

          private_key="$ssh_directory/production-key"
          known_hosts="$ssh_directory/known_hosts"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$private_key"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"

          ssh-keygen -y -P "" -f "$private_key" >/dev/null
          ssh-keygen -F "$PRODUCTION_HOST" -f "$known_hosts" >/dev/null

          {
            echo "SSH_PRIVATE_KEY_PATH=$private_key"
            echo "SSH_KNOWN_HOSTS_PATH=$known_hosts"
          } >> "$GITHUB_ENV"

      - name: Verify production runtime and run dry-runs
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
        run: |
          set -euo pipefail

          install -d -m 0700 verification-evidence
          evidence="verification-evidence/p0-production-dry-run.txt"

          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          target="$PRODUCTION_USER@$PRODUCTION_HOST"

          {
            echo "SalonAI production P0 verification"
            echo "UTC timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Expected release: $EXPECTED_RELEASE_TAG"
            echo
            echo "=== Runtime identity ==="
          } | tee "$evidence"

          ssh "${ssh_options[@]}" "$target"             'set -euo pipefail
             test "$(id -un)" = "salonai-deploy"
             test -d /opt/salonai
             docker inspect salonai-backend >/dev/null
             docker exec salonai-backend node -e "console.log(\"APP_VERSION=\" + process.env.APP_VERSION)"'             | tee -a "$evidence"

          grep -Fx "APP_VERSION=$EXPECTED_RELEASE_TAG" "$evidence" >/dev/null

          {
            echo
            echo "=== Super Admin promotion dry-run ==="
          } | tee -a "$evidence"

          ssh "${ssh_options[@]}" "$target"             'set -euo pipefail
             docker exec salonai-backend node scripts/promoteSuperAdmin.js                --user-name="Francesco"                --user-name="Francesco Guerriero"'             | tee -a "$evidence"

          {
            echo
            echo "=== Service-state migration dry-run ==="
          } | tee -a "$evidence"

          ssh "${ssh_options[@]}" "$target"             'set -euo pipefail
             docker exec salonai-backend node scripts/migrateServiceState.js'             | tee -a "$evidence"

          {
            echo
            echo "=== Finalized production stylist roster ==="
          } | tee -a "$evidence"

          ssh "${ssh_options[@]}" "$target" \
            'set -euo pipefail
             docker exec salonai-backend node scripts/classifyProductionStylistRoster.js --finalize --verify' \
            | tee -a "$evidence"

          {
            echo
            echo "=== Live workforce reconciliation ==="
          } | tee -a "$evidence"

          workforce_audit="$RUNNER_TEMP/p0-workforce-audit.mjs"
          cat > "$workforce_audit" <<'NODE'
          const mongoose =
            (await import("mongoose")).default;
          const {
            default: User,
          } =
            await import(
              "file:///app/src/models/user.js"
            );
          const {
            default: Stylist,
          } =
            await import(
              "file:///app/src/models/Stylist.js"
            );
          const {
            default: Service,
          } =
            await import(
              "file:///app/src/models/service.js"
            );
          const {
            buildAdminWorkforceRoster,
          } =
            await import(
              "file:///app/src/controllers/adminUserController.js"
            );

          await mongoose.connect(
            process.env.MONGODB_URI
          );

          try {
            const [
              staffUsers,
              stylistProfiles,
              services,
            ] =
              await Promise.all([
                User.find({
                  role: {
                    $ne:
                      "customer",
                  },
                })
                  .select(
                    "name email role permissions rolePermissions phone profilePhoto isActive emailVerified createdAt updatedAt"
                  )
                  .lean(),
                Stylist.find()
                  .select(
                    "userAccount email firstName lastName phone jobTitle biography specialties profileImage profilePublished acceptsAppointments isActive workingHours services createdAt updatedAt"
                  )
                  .lean(),
                Service.collection
                  .find({})
                  .project({
                    _id: 1,
                    active: 1,
                    published: 1,
                    bookable: 1,
                    onlineBookable: 1,
                  })
                  .toArray(),
              ]);

            const {
              accountRows,
              profileRows,
              roster,
            } =
              buildAdminWorkforceRoster(
                staffUsers,
                stylistProfiles
              );

            const representedProfileIds =
              new Set([
                ...accountRows
                  .map(
                    (row) =>
                      row.stylistProfile?.id
                  )
                  .filter(Boolean)
                  .map(String),
                ...profileRows
                  .map(
                    (row) =>
                      row.stylistProfile?.id
                  )
                  .filter(Boolean)
                  .map(String),
              ]);

            if (
              representedProfileIds.size !==
              stylistProfiles.length
            ) {
              throw new Error(
                "Workforce reconciliation does not represent every stylist profile exactly once."
              );
            }

            const profileAuthorityViolations =
              profileRows.filter(
                (row) =>
                  row.accountLinked !==
                    false ||
                  (row.permissions || [])
                    .length >
                    0 ||
                  (row.rolePermissions || [])
                    .length >
                    0
              );

            if (
              profileAuthorityViolations.length >
              0
            ) {
              throw new Error(
                "Profile-only workforce rows contain fabricated login authority."
              );
            }

            const legacyServices =
              services.filter(
                (service) =>
                  typeof service.published !==
                    "boolean" ||
                  typeof service.bookable !==
                    "boolean" ||
                  Object.prototype.hasOwnProperty.call(
                    service,
                    "onlineBookable"
                  )
              );

            if (
              legacyServices.length >
              0
            ) {
              throw new Error(
                `Canonical service-state verification found ${legacyServices.length} legacy record(s).`
              );
            }

            const roleCounts = {};
            for (
              const user
              of staffUsers
            ) {
              roleCounts[user.role] =
                (
                  roleCounts[user.role] ||
                  0
                ) + 1;
            }

            const stylistState =
              stylistProfiles.reduce(
                (summary, stylist) => {
                  if (
                    stylist.isActive ===
                    true
                  ) {
                    summary.active += 1;
                  }

                  if (
                    stylist.isActive ===
                      true &&
                    stylist.acceptsAppointments ===
                      true
                  ) {
                    summary.bookable += 1;
                  }

                  if (
                    stylist.isActive ===
                      true &&
                    stylist.profilePublished ===
                      true
                  ) {
                    summary.published += 1;
                  }

                  if (
                    stylist.isActive ===
                      true &&
                    stylist.acceptsAppointments ===
                      false
                  ) {
                    summary.activeNonBookable += 1;
                  }

                  if (
                    stylist.isActive ===
                      true &&
                    stylist.profilePublished ===
                      false
                  ) {
                    summary.activeUnpublished += 1;
                  }

                  return summary;
                },
                {
                  total: stylistProfiles.length,
                  active: 0,
                  bookable: 0,
                  published: 0,
                  activeNonBookable: 0,
                  activeUnpublished: 0,
                }
              );

            const serviceState =
              services.reduce(
                (summary, service) => {
                  summary.total += 1;

                  if (
                    service.active ===
                    false
                  ) {
                    summary.inactive += 1;
                  }

                  if (
                    service.published ===
                    false
                  ) {
                    summary.unpublished += 1;
                  }

                  if (
                    service.bookable ===
                    false
                  ) {
                    summary.notBookable += 1;
                  }

                  return summary;
                },
                {
                  total: 0,
                  inactive: 0,
                  unpublished: 0,
                  notBookable: 0,
                }
              );

            console.log(
              JSON.stringify(
                {
                  workforce: {
                    total:
                      roster.length,
                    accountBacked:
                      accountRows.length,
                    profileOnly:
                      profileRows.length,
                    representedProfiles:
                      representedProfileIds.size,
                    roleCounts,
                  },
                  stylistState,
                  serviceState,
                  legacyServiceRecords:
                    legacyServices.length,
                },
                null,
                2
              )
            );

            console.log(
              "[PASS] Live workforce reconciliation and canonical service-state audit completed."
            );
          } finally {
            await mongoose.disconnect();
          }
          NODE

          ssh "${ssh_options[@]}" "$target" \
            'docker exec -i salonai-backend node --input-type=module' \
            < "$workforce_audit" \
            | tee -a "$evidence"

          {
            echo
            echo "=== Deployed backend P0 regression tests ==="
          } | tee -a "$evidence"

          ssh "${ssh_options[@]}" "$target" \
            'set -euo pipefail
             docker exec salonai-backend node --test \
               src/test/rbacSuperAdmin.test.js \
               src/test/productionStylistRoster.test.js \
               src/test/whatsappStylistEligibility.test.js \
               src/test/productionP0BookingEnforcement.test.js' \
            | tee -a "$evidence"

          {
            echo
            echo "[PASS] Production P0 verification completed. No database writes were requested."
          } | tee -a "$evidence"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: salonai-production-p0-verification-${{ github.run_id }}
          path: verification-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Remove transient SSH credentials
        if: always()
        shell: bash
        run: |
          set -u
          if [[ -n "${SSH_PRIVATE_KEY_PATH:-}" ]]; then
            rm -f -- "$SSH_PRIVATE_KEY_PATH"
          fi
          if [[ -n "${SSH_KNOWN_HOSTS_PATH:-}" ]]; then
            rm -f -- "$SSH_KNOWN_HOSTS_PATH"
          fi
