name: Production SMTP Audit Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-smtp-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    name: Audit production SMTP readiness
    runs-on: ubuntu-24.04
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh_directory="$RUNNER_TEMP/salonai-smtp-audit"
          install -d -m 0700 "$ssh_directory"
          private_key="$ssh_directory/production-key"
          known_hosts="$ssh_directory/known_hosts"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$private_key"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"
          echo "SSH_PRIVATE_KEY_PATH=$private_key" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_PATH=$known_hosts" >> "$GITHUB_ENV"

      - name: Inspect production SMTP configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )

          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          env_file=/opt/salonai/.env.production
          if [[ ! -f "$env_file" ]]; then
            echo "smtp_env_file_present=false"
            exit 1
          fi

          has_value() {
            local key="$1"
            grep -Eq "^${key}=.+" "$env_file"
          }

          host=false
          user=false
          password=false
          from=false

          has_value SMTP_HOST && host=true
          has_value SMTP_USER && user=true
          has_value SMTP_PASSWORD && password=true
          (has_value EMAIL_FROM_ADDRESS || has_value EMAIL_FROM) && from=true

          echo "smtp_env_file_present=true"
          echo "smtp_host_present=$host"
          echo "smtp_user_present=$user"
          echo "smtp_password_present=$password"
          echo "smtp_from_present=$from"

          if [[ "$host" != true || "$user" != true || "$password" != true || "$from" != true ]]; then
            exit 2
          fi
          REMOTE

      - name: Remove one-time audit workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          workflow='.github/workflows/production-smtp-audit-once.yml'
          if [[ -f "$workflow" ]]; then
            git rm "$workflow"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ops: remove completed SMTP audit workflow'
            git push origin main
          fi
