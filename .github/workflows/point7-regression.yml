name: Point 7 CRM Retention Gate

on:
  pull_request:
    paths:
      - "backend/src/features/premium/automation/**"
      - "backend/src/test/point7CrmRetentionContracts.test.js"
      - "backend/src/test/point7MembershipRecoveryBridge.test.js"
      - "backend/src/test/retentionAutomation.test.js"
      - "frontend/src/Services/retentionAutomationService.js"
      - ".github/workflows/point7-regression.yml"
  push:
    branches:
      - main
    paths:
      - "backend/src/features/premium/automation/**"
      - "backend/src/test/point7CrmRetentionContracts.test.js"
      - "backend/src/test/point7MembershipRecoveryBridge.test.js"
      - "backend/src/test/retentionAutomation.test.js"
      - "frontend/src/Services/retentionAutomationService.js"
      - ".github/workflows/point7-regression.yml"

permissions:
  contents: read

jobs:
  point7-contracts:
    name: Point 7 CRM/retention contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run Point 7 CRM and existing retention regression tests
        run: >-
          node --test
          src/test/point7CrmRetentionContracts.test.js
          src/test/point7MembershipRecoveryBridge.test.js
          src/test/retentionAutomation.test.js

      - name: Run complete backend regression diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test-output.txt

      - name: Upload backend regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: point7-backend-regression-output
          path: backend/backend-test-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Verify application imports
        run: node -e "import('./src/app.js').then(() => console.log('Backend import OK'))"
