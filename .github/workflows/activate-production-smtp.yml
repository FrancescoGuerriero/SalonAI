name: SalonAI Production SMTP Activation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activate-production-smtp.yml

permissions:
  contents: read

concurrency:
  group: salonai-production-smtp-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Activate production SMTP
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Validate protected secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS SMTP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production secret is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$PRODUCTION_USER" == "salonai-deploy" ]]
          echo "Protected SMTP secret is present."

      - name: Configure strict SSH transport
        shell: bash
        run: |
          set -euo pipefail
          ssh_directory="$RUNNER_TEMP/salonai-smtp-ssh"
          install -d -m 0700 "$ssh_directory"
          private_key="$ssh_directory/production-key"
          known_hosts="$ssh_directory/known_hosts"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$private_key"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"
          ssh-keygen -y -P "" -f "$private_key" >/dev/null
          ssh-keygen -F "$PRODUCTION_HOST" -f "$known_hosts" >/dev/null
          {
            echo "SSH_PRIVATE_KEY_PATH=$private_key"
            echo "SSH_KNOWN_HOSTS_PATH=$known_hosts"
          } >> "$GITHUB_ENV"

      - name: Install SMTP credential with verification disabled
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          target="$PRODUCTION_USER@$PRODUCTION_HOST"
          local_password_file="$RUNNER_TEMP/smtp-password"
          remote_password_file="/tmp/salonai-smtp-password-${GITHUB_RUN_ID}"
          umask 077
          printf '%s' "$SMTP_PASSWORD" > "$local_password_file"
          scp "${ssh_options[@]}" "$local_password_file" "$target:$remote_password_file"
          rm -f "$local_password_file"

          ssh "${ssh_options[@]}" "$target" "bash -s -- '$remote_password_file'" <<'REMOTE'
          set -euo pipefail
          password_file="$1"
          env_file=/opt/salonai/.env.production
          trap 'rm -f "$password_file"' EXIT
          test -f "$env_file"
          python3 - "$env_file" "$password_file" <<'PY'
          from pathlib import Path
          import os
          import sys

          env_path = Path(sys.argv[1])
          password_path = Path(sys.argv[2])
          password = password_path.read_text()
          if not password:
              raise SystemExit("SMTP password is empty")

          updates = {
              "SALON_EMAIL": "info@francescopicardi.co.uk",
              "SMTP_HOST": "smtp.ionos.co.uk",
              "SMTP_PORT": "465",
              "SMTP_SECURE": "true",
              "SMTP_REQUIRE_TLS": "true",
              "SMTP_REJECT_UNAUTHORIZED": "true",
              "SMTP_USER": "info@francescopicardi.co.uk",
              "SMTP_PASSWORD": password,
              "EMAIL_FROM_NAME": "SalonAI",
              "EMAIL_FROM_ADDRESS": "info@francescopicardi.co.uk",
              "EMAIL_FROM": "info@francescopicardi.co.uk",
              "EMAIL_REPLY_TO": "info@francescopicardi.co.uk",
              "EMAIL_DELIVERY_ENABLED": "true",
              "EMAIL_PROVIDER_MODE": "smtp",
              "EMAIL_VERIFICATION_REQUIRED": "false",
          }

          lines = env_path.read_text().splitlines()
          result = []
          seen = set()
          for line in lines:
              if "=" in line and not line.lstrip().startswith("#"):
                  key = line.split("=", 1)[0].strip()
                  if key in updates:
                      result.append(f"{key}={updates[key]}")
                      seen.add(key)
                      continue
              result.append(line)
          for key, value in updates.items():
              if key not in seen:
                  result.append(f"{key}={value}")
          env_path.write_text("\n".join(result) + "\n")
          os.chmod(env_path, 0o600)
          PY
          cd /opt/salonai
          docker compose --env-file .env.production -f docker-compose.production.yml up -d --no-deps --force-recreate backend
          REMOTE

      - name: Verify transport and send real test email
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          target="$PRODUCTION_USER@$PRODUCTION_HOST"
          ssh "${ssh_options[@]}" "$target" <<'REMOTE'
          set -euo pipefail
          cd /opt/salonai
          for attempt in $(seq 1 30); do
            if docker compose --env-file .env.production -f docker-compose.production.yml exec -T backend node -e "import('./src/providers/emailProvider.js').then(async ({ verifyEmailTransport }) => { const result = await verifyEmailTransport(); if (!result.verified) process.exit(1); console.log('smtp_transport_verified=true'); })"; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "SMTP transport verification did not succeed." >&2
              exit 1
            fi
            sleep 2
          done
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T backend node -e "import('./src/providers/emailProvider.js').then(async ({ sendEmail }) => { const result = await sendEmail({ to: 'info@francescopicardi.co.uk', subject: 'SalonAI production email test', message: 'SalonAI production SMTP is live. This message confirms that real transactional email delivery is working.', html: '<p><strong>SalonAI production SMTP is live.</strong></p><p>This message confirms that real transactional email delivery is working.</p>' }); if (result?.status !== 'sent' || !result?.delivered) process.exit(1); console.log('smtp_test_message_sent=true'); })"
          REMOTE

      - name: Enable mandatory email verification
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          target="$PRODUCTION_USER@$PRODUCTION_HOST"
          ssh "${ssh_options[@]}" "$target" <<'REMOTE'
          set -euo pipefail
          env_file=/opt/salonai/.env.production
          python3 - "$env_file" <<'PY'
          from pathlib import Path
          import os
          import sys

          env_path = Path(sys.argv[1])
          lines = env_path.read_text().splitlines()
          result = []
          found = False
          for line in lines:
              if line.startswith("EMAIL_VERIFICATION_REQUIRED="):
                  result.append("EMAIL_VERIFICATION_REQUIRED=true")
                  found = True
              else:
                  result.append(line)
          if not found:
              result.append("EMAIL_VERIFICATION_REQUIRED=true")
          env_path.write_text("\n".join(result) + "\n")
          os.chmod(env_path, 0o600)
          PY
          cd /opt/salonai
          docker compose --env-file .env.production -f docker-compose.production.yml up -d --no-deps --force-recreate backend
          REMOTE

      - name: Verify live production state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if health="$(curl --fail --silent --show-error https://salonai.francescopicardi.co.uk/api/health 2>/dev/null)" && echo "$health" | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; then
              echo "$health"
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "Production health check did not become ready." >&2
              exit 1
            fi
            sleep 2
          done
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://salonai.francescopicardi.co.uk/)"
          [[ "$status" == "200" ]]
          echo "homepage_http_status=$status"

          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/salonai
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T backend node -e "import('./src/providers/emailProvider.js').then(async ({ emailDeliveryStatus, verifyEmailTransport }) => { const status = emailDeliveryStatus(); const verified = await verifyEmailTransport(); if (!status.live || !verified.verified || process.env.EMAIL_VERIFICATION_REQUIRED !== 'true') process.exit(1); console.log('email_delivery_live=true'); console.log('smtp_transport_verified=true'); console.log('email_verification_required=true'); })"
          REMOTE
