name: SalonAI Production Calendar Appointment Sync Acceptance

on:
  workflow_dispatch:
    inputs:
      expected_release_tag:
        description: Expected live application release
        required: true
        default: v8.15.18
        type: string
      provider:
        description: Calendar provider to end-to-end acceptance-test
        required: true
        default: google
        type: choice
        options:
          - google
          - outlook
      confirm_acceptance:
        description: Type RUN_CALENDAR_APPOINTMENT_SYNC_ACCEPTANCE to allow a temporary real SalonAI appointment and provider event lifecycle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: salonai-production-deployment
  cancel-in-progress: false

jobs:
  acceptance:
    name: Run controlled production appointment sync acceptance
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate acceptance request
        shell: bash
        env:
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
          PROVIDER: ${{ inputs.provider }}
          CONFIRM_ACCEPTANCE: ${{ inputs.confirm_acceptance }}
        run: |
          set -euo pipefail

          [[ "$EXPECTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PROVIDER" == "google" || "$PROVIDER" == "outlook" ]]

          if [[ "$CONFIRM_ACCEPTANCE" != "RUN_CALENDAR_APPOINTMENT_SYNC_ACCEPTANCE" ]]; then
            echo "Refusing production appointment mutation: explicit acceptance confirmation is missing." >&2
            exit 1
          fi

      - name: Configure strict SSH transport
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production secret is missing: $name" >&2
              exit 1
            fi
          done

          [[ "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_USER" == "salonai-deploy" ]]

          ssh_directory="$RUNNER_TEMP/salonai-ssh"
          install -d -m 0700 "$ssh_directory"

          private_key="$ssh_directory/production-key"
          known_hosts="$ssh_directory/known_hosts"

          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$private_key"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"

          ssh-keygen -y -P "" -f "$private_key" >/dev/null
          ssh-keygen -F "$PRODUCTION_HOST" -f "$known_hosts" >/dev/null

          {
            echo "SSH_PRIVATE_KEY_PATH=$private_key"
            echo "SSH_KNOWN_HOSTS_PATH=$known_hosts"
          } >> "$GITHUB_ENV"

      - name: Verify live release and calendar worker readiness
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
        run: |
          set -euo pipefail

          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )

          target="$PRODUCTION_USER@$PRODUCTION_HOST"

          runtime_version="$(
            ssh "${ssh_options[@]}" "$target"               'set -euo pipefail
               test "$(id -un)" = "salonai-deploy"
               test -d /opt/salonai
               docker inspect salonai-backend >/dev/null
               docker exec salonai-backend node -e "process.stdout.write(String(process.env.APP_VERSION || \"\\"))"'
          )"

          if [[ "$runtime_version" != "$EXPECTED_RELEASE_TAG" ]]; then
            echo "Production release mismatch. Expected $EXPECTED_RELEASE_TAG." >&2
            exit 1
          fi

          echo "APP_VERSION=$runtime_version"

          worker_json="$(
            ssh "${ssh_options[@]}" "$target"               'docker exec salonai-backend node --input-type=module -e '\'' 
                const response = await fetch("http://127.0.0.1:5000/api/health/ready");
                const payload = await response.json();
                const calendar = payload?.checks?.scheduler?.calendarSync || {};
                process.stdout.write(JSON.stringify({
                  httpOk: response.ok,
                  ready: payload?.ready === true,
                  enabled: calendar.enabled === true,
                  started: calendar.started === true,
                  required: calendar.required === true,
                  workerReady: calendar.ready === true,
                  lastFailedCycleAt: calendar.lastFailedCycleAt || null,
                  lastError: calendar.lastError || ""
                }));
              '\'''
          )"

          python3 - "$worker_json" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          required_true = [
              "httpOk",
              "ready",
              "enabled",
              "started",
              "required",
              "workerReady",
          ]

          missing = [key for key in required_true if payload.get(key) is not True]

          if missing:
              raise SystemExit(
                  "Calendar worker is not production-ready: " + ", ".join(missing)
              )

          if payload.get("lastFailedCycleAt") is not None:
              raise SystemExit("Calendar worker reports a failed cycle.")

          if payload.get("lastError"):
              raise SystemExit("Calendar worker reports a non-empty lastError.")

          print("Calendar worker readiness is green.")
          PY

          ssh "${ssh_options[@]}" "$target"             'set -euo pipefail
             docker exec salonai-backend node scripts/checkCalendarReadiness.js'

      - name: Run controlled appointment synchronization lifecycle
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail

          install -d -m 0700 acceptance-evidence
          raw_file="$RUNNER_TEMP/calendar-appointment-sync-acceptance-raw.txt"
          safe_file="acceptance-evidence/calendar-appointment-sync-acceptance.json"

          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )

          target="$PRODUCTION_USER@$PRODUCTION_HOST"

          set +e
          cat backend/scripts/testCalendarAppointmentSyncAcceptance.js             | ssh "${ssh_options[@]}" "$target"                 "docker exec -i -w /app/scripts                   -e CALENDAR_APPOINTMENT_ACCEPTANCE_CONFIRM=RUN_CALENDAR_APPOINTMENT_SYNC_ACCEPTANCE                   -e CALENDAR_APPOINTMENT_ACCEPTANCE_PROVIDER=$PROVIDER                   salonai-backend                   node --input-type=module"             > "$raw_file" 2>&1
          acceptance_status=$?
          set -e

          python3 - "$raw_file" "$safe_file" "$acceptance_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw_path = Path(sys.argv[1])
          safe_path = Path(sys.argv[2])
          exit_code = int(sys.argv[3])
          raw = raw_path.read_text(encoding="utf-8", errors="replace")

          begin = "__SALONAI_APPOINTMENT_SYNC_ACCEPTANCE_BEGIN__"
          end = "__SALONAI_APPOINTMENT_SYNC_ACCEPTANCE_END__"

          payload = {}

          try:
              body = raw.split(begin, 1)[1].split(end, 1)[0].strip()
              payload = json.loads(body)
          except Exception:
              payload = {}

          permissions = payload.get("permissions") or {}
          outbound = payload.get("outbound") or {}
          inbound = payload.get("inbound") or {}
          cleanup = payload.get("cleanup") or {}

          safe = {
              "success": payload.get("success") is True and exit_code == 0,
              "provider": payload.get("provider"),
              "permissions": {
                  "update": permissions.get("update") is True,
                  "cancel": permissions.get("cancel") is True,
              },
              "steps": payload.get("steps") if isinstance(payload.get("steps"), list) else [],
              "outbound": {
                  "create": outbound.get("create") is True,
                  "reschedule": outbound.get("reschedule") is True,
              },
              "inbound": {
                  "reschedule": inbound.get("reschedule") is True,
                  "cancel": inbound.get("cancel") is True,
                  "verifiedWebhooks": inbound.get("verifiedWebhooks") or 0,
              },
              "cleanup": {
                  "providerEventDeleted": cleanup.get("providerEventDeleted") is True,
                  "eventLinkDeleted": cleanup.get("eventLinkDeleted") is True,
                  "syncTaskDeleted": cleanup.get("syncTaskDeleted") is True,
                  "appointmentDeleted": cleanup.get("appointmentDeleted") is True,
                  "customerDeleted": cleanup.get("customerDeleted") is True,
              },
          }

          if not safe["success"]:
              safe["code"] = payload.get("code") or "CALENDAR_APPOINTMENT_ACCEPTANCE_FAILED"
              safe["message"] = payload.get("message") or (
                  "Calendar appointment synchronization acceptance failed. "
                  "Raw identifiers and provider details were withheld from workflow output."
              )

          safe_path.write_text(
              json.dumps(safe, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          rm -f -- "$raw_file"

          cat "$safe_file"

          if [[ "$acceptance_status" -ne 0 ]]; then
            echo "Calendar appointment synchronization acceptance failed." >&2
            exit "$acceptance_status"
          fi

          python3 - "$safe_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))

          if payload.get("success") is not True:
              raise SystemExit("Sanitized evidence did not report success.")

          if payload.get("permissions") != {"update": True, "cancel": True}:
              raise SystemExit("Required two-way appointment permissions were not verified.")

          if payload.get("outbound") != {"create": True, "reschedule": True}:
              raise SystemExit("SalonAI-to-provider appointment synchronization was incomplete.")

          if payload.get("inbound", {}).get("reschedule") is not True:
              raise SystemExit("Provider-to-SalonAI reschedule was not verified.")

          if payload.get("inbound", {}).get("cancel") is not True:
              raise SystemExit("Provider-to-SalonAI cancellation was not verified.")

          if int(payload.get("inbound", {}).get("verifiedWebhooks") or 0) < 2:
              raise SystemExit("Expected provider webhook evidence was not observed.")

          cleanup = payload.get("cleanup") or {}
          required_cleanup = [
              "providerEventDeleted",
              "eventLinkDeleted",
              "syncTaskDeleted",
              "appointmentDeleted",
              "customerDeleted",
          ]

          if not all(cleanup.get(key) is True for key in required_cleanup):
              raise SystemExit("Acceptance cleanup was incomplete.")

          print(
              "[PASS] SalonAI appointment create/update and provider reschedule/delete "
              "synchronized bidirectionally with complete cleanup."
          )
          PY

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: salonai-production-calendar-appointment-sync-${{ inputs.provider }}-${{ github.run_id }}
          path: acceptance-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Remove transient credentials and raw evidence
        if: always()
        shell: bash
        run: |
          set -u

          if [[ -n "${SSH_PRIVATE_KEY_PATH:-}" ]]; then
            rm -f -- "$SSH_PRIVATE_KEY_PATH"
          fi

          if [[ -n "${SSH_KNOWN_HOSTS_PATH:-}" ]]; then
            rm -f -- "$SSH_KNOWN_HOSTS_PATH"
          fi

          rm -f -- "$RUNNER_TEMP/calendar-appointment-sync-acceptance-raw.txt"
