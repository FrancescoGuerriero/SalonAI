name: SalonAI Production SMS Activation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activate-production-sms.yml

permissions:
  contents: read

concurrency:
  group: salonai-production-sms-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Activate production Twilio SMS
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate protected Twilio secrets
        shell: bash
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
        run: |
          set -euo pipefail
          for name in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_SMS_FROM; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production secret is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$TWILIO_ACCOUNT_SID" =~ ^AC[A-Za-z0-9]{30,}$ ]]
          [[ "$TWILIO_SMS_FROM" =~ ^\+[1-9][0-9]{7,14}$ ]]
          echo "Protected Twilio SMS secrets are present and structurally valid."

      - name: Verify Twilio account credentials
        shell: bash
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/twilio-account.json"
          http_code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --user "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN" "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_ACCOUNT_SID.json")"
          [[ "$http_code" == "200" ]]
          python3 - "$response" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if not str(data.get('sid','')).startswith('AC'):
              raise SystemExit('Twilio account response did not contain a valid Account SID.')
          if str(data.get('status','')).lower() not in {'', 'active'}:
              raise SystemExit('Twilio account is not active.')
          print('Twilio account authentication verified; account is active.')
          PY

      - name: Configure strict SSH transport
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Required production secret is missing: $name" >&2; exit 1; }
          done
          [[ "$PRODUCTION_USER" == "salonai-deploy" ]]
          ssh_directory="$RUNNER_TEMP/salonai-ssh"
          install -d -m 0700 "$ssh_directory"
          private_key="$ssh_directory/production-key"
          known_hosts="$ssh_directory/known_hosts"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$private_key"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"
          ssh-keygen -y -P "" -f "$private_key" >/dev/null
          ssh-keygen -F "$PRODUCTION_HOST" -f "$known_hosts" >/dev/null
          echo "SSH_PRIVATE_KEY_PATH=$private_key" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_PATH=$known_hosts" >> "$GITHUB_ENV"

      - name: Install Twilio SMS production configuration
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$SSH_PRIVATE_KEY_PATH" -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH")
          patch_file="$RUNNER_TEMP/sms-production.env"
          updater="$RUNNER_TEMP/update-salonai-env.py"
          umask 077
          {
            printf 'TWILIO_ACCOUNT_SID=%s\n' "$TWILIO_ACCOUNT_SID"
            printf 'TWILIO_AUTH_TOKEN=%s\n' "$TWILIO_AUTH_TOKEN"
            printf 'TWILIO_SMS_FROM=%s\n' "$TWILIO_SMS_FROM"
            printf 'TWILIO_FROM_NUMBER=%s\n' "$TWILIO_SMS_FROM"
            printf 'SMS_PROVIDER_MODE=twilio\n'
            printf 'SMS_PROVIDER=twilio\n'
            printf 'SMS_DELIVERY_ENABLED=true\n'
            printf 'TWILIO_WEBHOOK_VALIDATION_ENABLED=true\n'
            printf 'TWILIO_WEBHOOK_BASE_URL=https://salonai.francescopicardi.co.uk\n'
            printf 'TWILIO_STATUS_CALLBACK_URL=https://salonai.francescopicardi.co.uk/api/message-delivery/webhooks/twilio/status\n'
          } > "$patch_file"
          cat > "$updater" <<'PY'
          from pathlib import Path
          import sys
          env_path = Path(sys.argv[1]); patch_path = Path(sys.argv[2])
          existing = env_path.read_text(encoding='utf-8').splitlines()
          updates = dict(line.split('=',1) for line in patch_path.read_text(encoding='utf-8').splitlines() if line and not line.startswith('#'))
          seen=set(); output=[]
          for line in existing:
              if line and not line.lstrip().startswith('#') and '=' in line:
                  key=line.split('=',1)[0].strip()
                  if key in updates:
                      output.append(f'{key}={updates[key]}'); seen.add(key); continue
              output.append(line)
          for key,value in updates.items():
              if key not in seen: output.append(f'{key}={value}')
          env_path.write_text('\n'.join(output)+'\n', encoding='utf-8')
          PY
          remote_dir="/opt/salonai/.operations/sms-$GITHUB_RUN_ID"
          target="$PRODUCTION_USER@$PRODUCTION_HOST"
          ssh "${ssh_options[@]}" "$target" "install -d -m 0700 '$remote_dir'"
          scp "${ssh_options[@]}" "$patch_file" "$target:$remote_dir/sms-production.env"
          scp "${ssh_options[@]}" "$updater" "$target:$remote_dir/update-salonai-env.py"
          ssh "${ssh_options[@]}" "$target" "set -euo pipefail; python3 '$remote_dir/update-salonai-env.py' /opt/salonai/.env.production '$remote_dir/sms-production.env'; chmod 600 /opt/salonai/.env.production; rm -rf '$remote_dir'"

      - name: Recreate backend and verify SMS configuration
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$SSH_PRIVATE_KEY_PATH" -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH")
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" 'set -euo pipefail
            cd /opt/salonai
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --force-recreate backend
            for attempt in $(seq 1 30); do
              status=$(docker inspect --format="{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}" salonai-backend 2>/dev/null || true)
              [ "$status" = "healthy" ] && break
              sleep 3
            done
            test "$(docker inspect --format="{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}" salonai-backend)" = "healthy"
            docker exec salonai-backend node -e "const required={SMS_PROVIDER_MODE:'twilio',SMS_DELIVERY_ENABLED:'true',TWILIO_WEBHOOK_VALIDATION_ENABLED:'true'}; for (const [k,v] of Object.entries(required)) if (process.env[k] !== v) throw new Error(k+' is not configured'); for (const k of ['TWILIO_ACCOUNT_SID','TWILIO_AUTH_TOKEN','TWILIO_SMS_FROM','TWILIO_STATUS_CALLBACK_URL']) if (!process.env[k]) throw new Error(k+' is missing'); console.log('Production Twilio SMS configuration is active.');"'

      - name: Verify public production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://salonai.francescopicardi.co.uk/api/health/ready > "$RUNNER_TEMP/health.json"
          python3 - "$RUNNER_TEMP/health.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          if not data.get('success') or not data.get('ready'):
              raise SystemExit('Production backend is not ready after SMS activation.')
          print('Production backend remains ready after Twilio SMS activation.')
          PY
