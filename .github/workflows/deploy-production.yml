name: SalonAI Production Deployment

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable SalonAI release tag, for example v8.0.0
        required: true
        type: string
      confirm_production:
        description: Type DEPLOY to confirm production deployment
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: salonai-production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deployment request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require explicit confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "DEPLOY" ]]

      - name: Checkout release source
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Validate immutable release tag
        run: node scripts/ci/validate-release-tag.mjs "${{ inputs.release_tag }}"

      - name: Verify release evidence exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          for asset in release-manifest.json rollback-metadata.json SHA256SUMS.txt; do
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq ".assets[].name" |
              grep -Fx -- "$asset" >/dev/null
          done

  deploy:
    name: Deploy production
    needs: validate
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEPLOY_ROOT: /opt/salonai
      RELEASE_SOURCE_DIR: release-source
      CONTROL_SOURCE_DIR: deployment-control
      RELEASE_EVIDENCE_DIR: release-evidence
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          path: ${{ env.RELEASE_SOURCE_DIR }}
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Checkout trusted deployment controls
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          path: ${{ env.CONTROL_SOURCE_DIR }}
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Configure strict SSH transport
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in \
            PRODUCTION_HOST \
            PRODUCTION_USER \
            PRODUCTION_SSH_KEY \
            PRODUCTION_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production secret is missing: $name" >&2
              exit 1
            fi
          done

          [[ "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_USER" == "salonai-deploy" ]]

          ssh_directory="$RUNNER_TEMP/salonai-ssh"
          install -d -m 0700 "$ssh_directory"

          private_key="$ssh_directory/production-key"
          known_hosts="$ssh_directory/known_hosts"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$private_key"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"

          ssh-keygen -y -P "" -f "$private_key" >/dev/null
          ssh-keygen -F "$PRODUCTION_HOST" -f "$known_hosts" >/dev/null

          {
            echo "SSH_PRIVATE_KEY_PATH=$private_key"
            echo "SSH_KNOWN_HOSTS_PATH=$known_hosts"
          } >> "$GITHUB_ENV"

      - name: Validate production host
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )

          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            'set -euo pipefail
             test "$(id -un)" = "salonai-deploy"
             test -d /opt/salonai
             test -f /opt/salonai/.env.production
             docker version >/dev/null
             docker compose version >/dev/null
             export PATH="$HOME/.local/bin:$PATH"
             command -v pwsh >/dev/null'

      - name: Download and verify release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_EVIDENCE_DIR"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RELEASE_EVIDENCE_DIR"

          (
            cd "$RELEASE_EVIDENCE_DIR"
            sha256sum --check SHA256SUMS.txt
          )

          source_commit="$(git -C "$RELEASE_SOURCE_DIR" rev-parse HEAD)"
          node "$CONTROL_SOURCE_DIR/scripts/ci/validate-deployment-evidence.mjs" \
            "$RELEASE_EVIDENCE_DIR" \
            "$RELEASE_TAG" \
            "$source_commit"

      - name: Prepare immutable deployment payload
        shell: bash
        run: |
          set -euo pipefail
          payload_directory="$RUNNER_TEMP/salonai-deployment-payload"
          rm -rf "$payload_directory"
          install -d -m 0700 "$payload_directory"

          for directory in \
            ai-service \
            backend \
            config \
            frontend \
            monitoring \
            nginx \
            scripts; do
            cp -a "$RELEASE_SOURCE_DIR/$directory" "$payload_directory/$directory"
          done

          for file in \
            docker-compose.production.yml \
            docker-compose.observability.yml; do
            cp "$RELEASE_SOURCE_DIR/$file" "$payload_directory/$file"
          done

          rm -rf "$payload_directory/scripts/deployment"
          cp -a \
            "$CONTROL_SOURCE_DIR/scripts/deployment" \
            "$payload_directory/scripts/deployment"
          cp -a "$RELEASE_EVIDENCE_DIR" "$payload_directory/release-evidence"

          tar -C "$payload_directory" \
            -czf "$RUNNER_TEMP/salonai-deployment-payload.tgz" \
            .

      - name: Upload payload to protected staging directory
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          remote_staging="$DEPLOY_ROOT/.deployments/$RELEASE_TAG-$GITHUB_RUN_ID"
          target="$PRODUCTION_USER@$PRODUCTION_HOST"

          ssh "${ssh_options[@]}" "$target" \
            "install -d -m 0700 '$remote_staging'"
          scp "${ssh_options[@]}" \
            "$RUNNER_TEMP/salonai-deployment-payload.tgz" \
            "$target:$remote_staging/payload.tgz"
          ssh "${ssh_options[@]}" "$target" \
            "tar -xzf '$remote_staging/payload.tgz' -C '$remote_staging'"

      - name: Log in to GHCR on production host
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )

          printf '%s' "$GHCR_TOKEN" |
            ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy and smoke test
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          remote_staging="$DEPLOY_ROOT/.deployments/$RELEASE_TAG-$GITHUB_RUN_ID"

          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "export PATH=\"\$HOME/.local/bin:\$PATH\"; \
             pwsh -NoLogo -NoProfile -NonInteractive \
               -File '$remote_staging/scripts/deployment/Invoke-RemoteProductionDeployment.ps1' \
               -StagingRoot '$remote_staging' \
               -DeployRoot '$DEPLOY_ROOT' \
               -ReleaseTag '$RELEASE_TAG' \
               -EvidenceArchivePath '$remote_staging/operation-evidence.tgz'"

      - name: Collect deployment evidence
        if: always()
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -u
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          remote_staging="$DEPLOY_ROOT/.deployments/$RELEASE_TAG-$GITHUB_RUN_ID"
          target="$PRODUCTION_USER@$PRODUCTION_HOST"
          install -d -m 0700 deployment-evidence

          if scp "${ssh_options[@]}" \
            "$target:$remote_staging/operation-evidence.tgz" \
            deployment-evidence/operation-evidence.tgz; then
            tar -C deployment-evidence \
              -xzf deployment-evidence/operation-evidence.tgz
          else
            echo "Remote deployment evidence was unavailable." >&2
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: salonai-production-deployment-${{ inputs.release_tag }}-${{ github.run_id }}
          path: deployment-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Remove transient production credentials and staging files
        if: always()
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -u
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          remote_staging="$DEPLOY_ROOT/.deployments/$RELEASE_TAG-$GITHUB_RUN_ID"

          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "docker logout ghcr.io >/dev/null 2>&1 || true; \
             rm -rf -- '$remote_staging'" || true
