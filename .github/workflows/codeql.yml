name: SalonAI CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

concurrency:
  group: salonai-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect code scanning availability
        id: code-scanning
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1"
          http_status="$(curl --silent --show-error --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${api_url}")"

          if [[ "${http_status}" == "200" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub code scanning is available; CodeQL results will be published."
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "GitHub code scanning returned HTTP ${http_status}; CodeQL analysis will run without platform upload and SARIF will be retained as an artifact."
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ steps.code-scanning.outputs.available == 'true' && 'always' || 'never' }}

      - name: Upload CodeQL analysis evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: salonai-codeql-${{ matrix.language }}-${{ github.sha }}
          path: ../results
          if-no-files-found: warn
          retention-days: 30
