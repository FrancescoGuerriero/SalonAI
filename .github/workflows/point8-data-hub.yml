permissions:
  contents: read

jobs:
  point8-contracts:
    name: Point 8 Data Hub contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run Point 8 Data Hub, Marketing, advisory, evaluation, offline experiment, promotion-planning, location and provider adapter tests
        run: >-
          node --test
          src/test/stage8AiAdvisoryContracts.test.js
          src/test/stage8AiCandidateEvaluationContracts.test.js
          src/test/stage8AiOfflineExperimentContracts.test.js
          src/test/stage8AiPromotionProposalContracts.test.js
          src/test/stage8DataHubContracts.test.js
          src/test/stage8LocationOwnershipContracts.test.js
          src/test/stage8MarketingConnectionsContracts.test.js
          src/test/stage8MarketingProviderWave1.test.js
          src/test/stage8MarketingProviderWave2.test.js
          src/test/stage8MarketingProviderWave3.test.js
          src/test/stage8MarketingProviderWave4.test.js
          src/test/stage8MarketingProviderWave5.test.js

      - name: Verify backend source
        run: npm run check

      - name: Verify application imports
        run: node -e "import('./src/app.js').then(() => console.log('Backend import OK'))"

  point8-frontend:
    name: Point 8 Data Hub workspace build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Data Hub, AI readiness and Marketing workspaces
        run: npm run build
        working-directory: frontend

      - name: Enforce frontend bundle budget
        run: npm run check:bundle
        working-directory: frontend
