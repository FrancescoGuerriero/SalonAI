name: SalonAI Production Assign All Services To Stylists

on:
  workflow_dispatch:
    inputs:
      expected_release_tag:
        description: Expected live application release
        required: true
        type: string
      confirm_assignment:
        description: Type ASSIGN_ALL_SERVICES_TO_ALL_STYLISTS to apply
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: salonai-production-deployment
  cancel-in-progress: false

jobs:
  assign:
    name: Assign all services to all stylists
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Validate request
        shell: bash
        env:
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
          CONFIRM_ASSIGNMENT: ${{ inputs.confirm_assignment }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$CONFIRM_ASSIGNMENT" = "ASSIGN_ALL_SERVICES_TO_ALL_STYLISTS"

      - name: Configure strict SSH transport
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production secret is missing: $name" >&2
              exit 1
            fi
          done

          [[ "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_USER" == "salonai-deploy" ]]

          ssh_directory="$RUNNER_TEMP/salonai-ssh"
          install -d -m 0700 "$ssh_directory"

          private_key="$ssh_directory/production-key"
          known_hosts="$ssh_directory/known_hosts"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$private_key"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"

          ssh-keygen -y -P "" -f "$private_key" >/dev/null
          ssh-keygen -F "$PRODUCTION_HOST" -f "$known_hosts" >/dev/null

          {
            echo "SSH_PRIVATE_KEY_PATH=$private_key"
            echo "SSH_KNOWN_HOSTS_PATH=$known_hosts"
          } >> "$GITHUB_ENV"

      - name: Dry-run, apply and verify assignment
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag }}
        run: |
          set -euo pipefail

          install -d -m 0700 assignment-evidence
          evidence="assignment-evidence/stylist-service-assignment.txt"

          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )
          target="$PRODUCTION_USER@$PRODUCTION_HOST"

          {
            echo "SalonAI production stylist service assignment"
            echo "UTC timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Expected release: $EXPECTED_RELEASE_TAG"
            echo
            echo "=== Runtime identity ==="
          } | tee "$evidence"

          ssh "${ssh_options[@]}" "$target" \
            'set -euo pipefail
             test "$(id -un)" = "salonai-deploy"
             test -d /opt/salonai
             docker inspect salonai-backend >/dev/null
             docker exec salonai-backend node -e "console.log(\"APP_VERSION=\" + process.env.APP_VERSION)"' \
            | tee -a "$evidence"

          grep -Fx "APP_VERSION=$EXPECTED_RELEASE_TAG" "$evidence" >/dev/null

          {
            echo
            echo "=== Dry run ==="
          } | tee -a "$evidence"

          ssh "${ssh_options[@]}" "$target" \
            'set -euo pipefail
             docker exec salonai-backend node scripts/assignAllServicesToStylists.js' \
            | tee -a "$evidence"

          {
            echo
            echo "=== Apply ==="
          } | tee -a "$evidence"

          ssh "${ssh_options[@]}" "$target" \
            'set -euo pipefail
             docker exec \
               -e STYLIST_SERVICE_ASSIGNMENT_CONFIRM=ASSIGN_ALL_SERVICES_TO_ALL_STYLISTS \
               salonai-backend \
               node scripts/assignAllServicesToStylists.js --apply' \
            | tee -a "$evidence"

          {
            echo
            echo "=== Post-apply verification ==="
          } | tee -a "$evidence"

          ssh "${ssh_options[@]}" "$target" \
            'set -euo pipefail
             docker exec salonai-backend node scripts/assignAllServicesToStylists.js' \
            | tee -a "$evidence"

          if ! tail -n 40 "$evidence" | grep -Eq '"toUpdateCount"[[:space:]]*:[[:space:]]*0'; then
            echo "[FAIL] Post-apply verification did not report toUpdateCount: 0." | tee -a "$evidence"
            exit 1
          fi

          echo "[PASS] Every current stylist has every current service assigned." | tee -a "$evidence"

      - name: Upload assignment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: salonai-production-stylist-service-assignment-${{ github.run_id }}
          path: assignment-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Remove transient SSH credentials
        if: always()
        shell: bash
        run: |
          set -u
          if [[ -n "${SSH_PRIVATE_KEY_PATH:-}" ]]; then
            rm -f -- "$SSH_PRIVATE_KEY_PATH"
          fi
          if [[ -n "${SSH_KNOWN_HOSTS_PATH:-}" ]]; then
            rm -f -- "$SSH_KNOWN_HOSTS_PATH"
          fi
