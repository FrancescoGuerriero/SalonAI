name: Phase 8.9 One-Time Release and Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase89-release-deploy-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: phase89-one-time-release-deploy
  cancel-in-progress: false

jobs:
  release-and-deploy:
    name: Release v8.9.0 and deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RELEASE_TAG: v8.9.0
      TARGET_SHA: 12bc9830f0f600d418891e818be1eadcde5141ab
      LIVE_ORIGIN: https://salonai.francescopicardi.co.uk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Validate immutable release target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            existing="$(git rev-parse "$RELEASE_TAG^{commit}")"
            if [[ "$existing" != "$TARGET_SHA" ]]; then
              echo "Release tag $RELEASE_TAG already exists at unexpected commit $existing." >&2
              exit 1
            fi
          fi

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "SalonAI $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          resolved="$(git rev-parse "$RELEASE_TAG^{commit}")"
          [[ "$resolved" == "$TARGET_SHA" ]]

      - name: Dispatch release workflow
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "release_tag=$RELEASE_TAG"

          run_id=""
          for attempt in $(seq 1 60); do
            latest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$latest" != "0" && "$latest" != "$previous" ]]; then
              run_id="$latest"
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "Could not resolve the dispatched release workflow run." >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Release workflow run: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in release-manifest.json rollback-metadata.json SHA256SUMS.txt; do
            grep -Fx -- "$asset" <<< "$assets" >/dev/null
          done

      - name: Dispatch production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-production.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"

          gh workflow run deploy-production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "release_tag=$RELEASE_TAG" \
            -f "confirm_production=DEPLOY"

          run_id=""
          for attempt in $(seq 1 60); do
            latest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-production.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$latest" != "0" && "$latest" != "$previous" ]]; then
              run_id="$latest"
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "Could not resolve the dispatched production deployment run." >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Production deployment run: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify live site
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$LIVE_ORIGIN/" >/dev/null
          health="$(curl --fail --silent --show-error --location --max-time 30 "$LIVE_ORIGIN/api/health")"
          printf '%s\n' "$health"
          grep -q '"status":"healthy"' <<< "$health"

      - name: Remove one-time launcher
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          launcher=".github/workflows/phase89-release-deploy-once.yml"
          if [[ -f "$launcher" ]]; then
            git rm "$launcher"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ops: remove completed v8.9.0 deployment launcher"
            git push origin main
          fi
