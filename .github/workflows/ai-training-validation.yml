name: SalonAI AI Training Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai-service/requirements.training.txt'
      - 'ai-service/train_*.py'
      - 'ai-service/app/training/**'
      - 'ai-service/app/governance/**'
      - 'ai-service/app/schemas/ai_core.py'
      - 'ai-service/tests/test_*training*.py'
      - 'ai-service/tests/test_ai_core.py'
      - 'backend/src/features/aiPlatform/**'
      - 'backend/src/models/WorkforceCapacitySnapshot.js'
      - 'backend/scripts/build*TrainingDataset.js'
      - 'backend/scripts/*DemandAiCore*.js'
      - 'backend/scripts/captureWorkforceCapacitySnapshot.js'
      - 'backend/src/test/*AiCore*.test.js'
      - 'backend/src/test/demandAiCoreDataset.test.js'
      - 'backend/src/test/workforceCapacitySnapshot.test.js'
      - '.github/workflows/ai-training-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salonai-ai-training-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-contract:
    name: AI training environment
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.runtime.txt
            ai-service/requirements.training.txt

      - name: Install controlled training dependencies
        shell: bash
        working-directory: ai-service
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.training.txt
          python -m pip check

      - name: Compile controlled training entry points
        shell: bash
        working-directory: ai-service
        run: |
          set -euo pipefail
          python -m py_compile train_no_show.py
          python -m py_compile train_no_show_ai_core.py
          python -m py_compile app/training/demand_forecasting.py

      - name: Validate no-show training CLI imports
        shell: bash
        working-directory: ai-service
        run: |
          set -euo pipefail
          python train_no_show.py --help
          python train_no_show_ai_core.py --help

      - name: Run AI Core Python training contracts
        shell: bash
        working-directory: ai-service
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_demand_training_core.py \
            tests/test_ai_training_manifest_policy.py \
            tests/test_offline_training_contract.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        shell: bash
        working-directory: backend
        run: npm ci

      - name: Run AI Core backend dataset contracts
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          node --test \
            src/test/noShowAiCoreManifest.test.js \
            src/test/demandAiCoreDataset.test.js \
            src/test/workforceCapacitySnapshot.test.js

      - name: Verify AI Core backend source
        shell: bash
        working-directory: backend
        run: npm run check
