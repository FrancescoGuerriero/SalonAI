name: SalonAI AI Training Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai-service/requirements.training.txt'
      - 'ai-service/train_*.py'
      - 'backend/src/features/aiPlatform/**'
      - 'backend/scripts/build*TrainingDataset.js'
      - '.github/workflows/ai-training-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salonai-ai-training-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-contract:
    name: AI training environment
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.runtime.txt
            ai-service/requirements.training.txt

      - name: Install controlled training dependencies
        shell: bash
        working-directory: ai-service
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.training.txt
          python -m pip check

      - name: Compile training entry points
        shell: bash
        working-directory: ai-service
        run: |
          set -euo pipefail
          python -m py_compile train_no_show.py

      - name: Validate no-show training CLI imports
        shell: bash
        working-directory: ai-service
        run: |
          set -euo pipefail
          python train_no_show.py --help
