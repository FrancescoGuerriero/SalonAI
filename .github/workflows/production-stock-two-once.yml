name: Production Product Stock To Two Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-stock-two-once.yml'

permissions:
  contents: write

jobs:
  normalize-stock:
    name: Set every production product stock to 2
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Configure SSH
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ssh_directory="$RUNNER_TEMP/salonai-stock-update"
          install -d -m 0700 "$ssh_directory"
          private_key="$ssh_directory/production-key"
          known_hosts="$ssh_directory/known_hosts"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$private_key"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"
          echo "SSH_PRIVATE_KEY_PATH=$private_key" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_PATH=$known_hosts" >> "$GITHUB_ENV"

      - name: Set and verify product stock
        shell: bash
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_PRIVATE_KEY_PATH"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
          )

          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "docker exec salonai-backend node --input-type=module -e 'import mongoose from \"mongoose\"; import Product from \"./src/features/commerce/Product.js\"; const uri=process.env.MONGODB_URI; if(!uri) throw new Error(\"MONGODB_URI is unavailable\"); await mongoose.connect(uri); try { const total=await Product.countDocuments({}); const before=await Product.countDocuments({stockQuantity:2}); const result=await Product.updateMany({}, {\$set:{stockQuantity:2}}); const after=await Product.countDocuments({stockQuantity:2}); console.log(JSON.stringify({success:after===total,targetStock:2,totalProducts:total,alreadyAtTwo:before,matchedCount:result.matchedCount,modifiedCount:result.modifiedCount,productsAtTwoAfter:after},null,2)); if(after!==total) process.exitCode=1; } finally { await mongoose.disconnect(); }'"

      - name: Remove one-time stock workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          workflow='.github/workflows/production-stock-two-once.yml'
          if [[ -f "$workflow" ]]; then
            git rm "$workflow"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ops: remove completed product stock workflow'
            git push origin main
          fi
