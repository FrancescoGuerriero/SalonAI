name: SalonAI Fast CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salonai-fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend fast check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Check backend source
        run: npm run check
        working-directory: backend

      - name: Verify backend application imports
        run: node -e "import('./src/app.js').then(() => console.log('Backend import OK'))"
        working-directory: backend

  frontend:
    name: Frontend fast check
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  ai-service:
    name: AI-service syntax check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Compile AI-service
        run: python -m compileall -q app .
        working-directory: ai-service

  ci-complete:
    name: CI complete
    if: always()
    needs: [backend, frontend, ai-service]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce fast checks
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          AI_RESULT: ${{ needs.ai-service.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND_RESULT" == "success" ]]
          [[ "$FRONTEND_RESULT" == "success" ]]
          [[ "$AI_RESULT" == "success" ]]
          echo "SalonAI fast CI passed."
