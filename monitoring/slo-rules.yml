groups:
  - name: salonai-slo-recording
    interval: 30s

    rules:
      - record: salonai:slo_backend_availability:ratio_5m
        expr: avg_over_time(salonai_backend_ready[5m])

      - record: salonai:slo_backend_availability:ratio_30m
        expr: avg_over_time(salonai_backend_ready[30m])

      - record: salonai:slo_backend_error_ratio:rate5m
        expr: |
          (
            sum(rate(salonai_http_requests_total{status_class="5xx"}[5m]))
            or vector(0)
          )
          /
          clamp_min(
            sum(rate(salonai_http_requests_total[5m]))
            or vector(0),
            0.001
          )

      - record: salonai:slo_backend_error_ratio:rate30m
        expr: |
          (
            sum(rate(salonai_http_requests_total{status_class="5xx"}[30m]))
            or vector(0)
          )
          /
          clamp_min(
            sum(rate(salonai_http_requests_total[30m]))
            or vector(0),
            0.001
          )

      - record: salonai:slo_backend_error_ratio:rate6h
        expr: |
          (
            sum(rate(salonai_http_requests_total{status_class="5xx"}[6h]))
            or vector(0)
          )
          /
          clamp_min(
            sum(rate(salonai_http_requests_total[6h]))
            or vector(0),
            0.001
          )

      - record: salonai:slo_backend_latency_p95_seconds:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(salonai_http_request_duration_seconds_bucket[5m])
            )
          )

      - record: salonai:slo_backend_error_budget_remaining:ratio_24h
        expr: |
          clamp_max(
            clamp_min(
              1 - (
                (1 - avg_over_time(salonai_backend_ready[24h]))
                / 0.001
              ),
              0
            ),
            1
          )

      - record: salonai:slo_endpoint_availability:ratio_5m
        expr: avg_over_time(probe_success{job="salonai-endpoints"}[5m])

  - name: salonai-slo-alerts
    interval: 30s

    rules:
      - alert: SalonAIBackendUnavailableSLO
        expr: salonai_backend_ready{service="salonai-backend"} == 0
        for: 2m

        labels:
          severity: critical
          service: salonai-backend
          slo: availability
          objective: "99.9"

        annotations:
          summary: SalonAI backend is unavailable
          description: The backend readiness metric has remained zero for two minutes.
          runbook_url: docs/runbooks/backend-unavailable.md

      - alert: SalonAIBackendSLOBurnRateCritical
        expr: |
          salonai:slo_backend_error_ratio:rate5m > 0.0144
          and
          salonai:slo_backend_error_ratio:rate30m > 0.0144
        for: 2m

        labels:
          severity: critical
          service: salonai-backend
          slo: availability
          objective: "99.9"

        annotations:
          summary: SalonAI is consuming error budget rapidly
          description: The backend error ratio is above the 14.4x burn-rate threshold in both the 5-minute and 30-minute windows.
          runbook_url: docs/runbooks/high-error-rate.md

      - alert: SalonAIBackendSLOBurnRateWarning
        expr: |
          salonai:slo_backend_error_ratio:rate30m > 0.006
          and
          salonai:slo_backend_error_ratio:rate6h > 0.006
        for: 15m

        labels:
          severity: warning
          service: salonai-backend
          slo: availability
          objective: "99.9"

        annotations:
          summary: SalonAI error budget burn is elevated
          description: The backend error ratio is above the 6x burn-rate threshold in both the 30-minute and 6-hour windows.
          runbook_url: docs/runbooks/high-error-rate.md

      - alert: SalonAIBackendAvailabilitySLOBreach
        expr: salonai:slo_backend_availability:ratio_30m < 0.999
        for: 10m

        labels:
          severity: warning
          service: salonai-backend
          slo: availability
          objective: "99.9"

        annotations:
          summary: SalonAI backend availability is below its objective
          description: Thirty-minute backend availability is below 99.9 percent.
          runbook_url: docs/runbooks/backend-unavailable.md

      - alert: SalonAIBackendLatencySLOBreach
        expr: salonai:slo_backend_latency_p95_seconds:5m > 1
        for: 10m

        labels:
          severity: warning
          service: salonai-backend
          slo: latency
          objective: "p95-under-1s"

        annotations:
          summary: SalonAI backend latency is above its objective
          description: Five-minute p95 backend latency has exceeded one second for ten minutes.
          runbook_url: docs/runbooks/high-latency.md

      - alert: SalonAIBackendErrorBudgetLow
        expr: salonai:slo_backend_error_budget_remaining:ratio_24h < 0.25
        for: 15m

        labels:
          severity: warning
          service: salonai-backend
          slo: availability
          objective: "99.9"

        annotations:
          summary: SalonAI backend error budget is low
          description: Less than 25 percent of the rolling 24-hour availability error budget remains.
          runbook_url: docs/runbooks/high-error-rate.md

      - alert: SalonAIEndpointProbeFailed
        expr: probe_success{job="salonai-endpoints"} == 0
        for: 2m

        labels:
          severity: critical
          slo: endpoint-availability
          objective: "99.9"

        annotations:
          summary: SalonAI endpoint probe failed
          description: Black-box monitoring cannot reach {{ $labels.service }} at {{ $labels.instance }}.
          runbook_url: docs/runbooks/backend-unavailable.md
