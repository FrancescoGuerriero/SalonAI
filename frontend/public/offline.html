<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111110" />
    <title>SalonAI is offline</title>
    <style>
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1rem;color:#111110;background:#fbfaf7;font:16px/1.6 system-ui,sans-serif}.card{width:min(100%,560px);padding:2rem;border:1px solid #eadbbd;border-radius:14px;background:#fff;box-shadow:0 18px 42px rgba(17,17,16,.12)}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:#c9a227;font-size:1.5rem}h1{margin:1rem 0 .4rem}p{color:#555552}button{min-height:44px;padding:.7rem 1rem;border:0;border-radius:8px;background:#111110;color:#fff;font:inherit;font-weight:750;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="mark">✦</div><h1>You are offline</h1><p>SalonAI needs a connection for live availability, bookings, account details and payments. Reconnect, then try again.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
