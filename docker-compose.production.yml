name: salonai-production

services:
  ai-service:
    image: ${AI_SERVICE_IMAGE:?AI_SERVICE_IMAGE is required}
    container_name: salonai-ai-service
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACE_EXPORT_TIMEOUT_MS: ${TRACE_EXPORT_TIMEOUT_MS:-5000}
      OTEL_SERVICE_NAME: salonai-ai-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=salonai,deployment.environment.name=production,service.version=${APP_VERSION}
    expose:
      - "8000"
    volumes:
      - salonai-ai-model-cache:/app/model-cache
    networks:
      - salonai-private
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: salonai-backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      APPLICATION_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      API_BASE_URL: ${PUBLIC_BASE_URL}/api
      BOOKING_URL: ${PUBLIC_BASE_URL}/booking
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      SERVER_SHUTDOWN_TIMEOUT_MS: ${SERVER_SHUTDOWN_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACE_EXPORT_TIMEOUT_MS: ${TRACE_EXPORT_TIMEOUT_MS:-5000}
      OTEL_SERVICE_NAME: salonai-backend
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=salonai,deployment.environment.name=production,service.version=${APP_VERSION}
    expose:
      - "5000"
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - salonai-private
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/api/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    stop_signal: SIGTERM
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: salonai-frontend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - salonai-private
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:8080/health || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_signal: SIGTERM
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  edge:
    image: nginx:1.27-alpine
    container_name: salonai-edge
    restart: unless-stopped
    environment:
      SALONAI_DOMAIN: ${SALONAI_DOMAIN:?SALONAI_DOMAIN is required}
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/salonai.https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR is required}:/etc/nginx/tls:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - salonai-private
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --no-check-certificate --spider https://127.0.0.1/healthz || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: salonai-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - salonai-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - salonai-private
    healthcheck:
      test:
        [
          "CMD",
          "/bin/promtool",
          "query",
          "instant",
          "http://127.0.0.1:9090",
          "up"
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  salonai-private:
    name: salonai-private
    driver: bridge

volumes:
  salonai-ai-model-cache:
    name: salonai-ai-model-cache
  salonai-prometheus-data:
    name: salonai-prometheus-data
