upstream salonai_frontend {
    server frontend:8080;
    keepalive 16;
}

upstream salonai_backend {
    server backend:5000;
    keepalive 32;
}

upstream salonai_ai_service {
    server ai-service:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name _;
    charset utf-8;

    add_header
        X-Request-ID
        $salonai_request_id
        always;

    add_header
        X-Content-Type-Options
        "nosniff"
        always;

    add_header
        X-Frame-Options
        "SAMEORIGIN"
        always;

    add_header
        Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    add_header
        Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;

    location = /healthz {
        access_log off;
        default_type application/json;

        return 200
            '{"status":"ok","service":"salonai-edge","requestId":"$salonai_request_id"}';
    }

    location ~ ^/api/(auth|users)/(login|register|forgot-password|reset-password) {
        limit_req
            zone=salonai_auth_limit
            burst=10
            nodelay;

        proxy_pass http://salonai_backend;
        proxy_http_version 1.1;

        proxy_hide_header X-Request-ID;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $salonai_request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        limit_req
            zone=salonai_api_limit
            burst=60
            nodelay;

        proxy_pass http://salonai_backend;
        proxy_http_version 1.1;

        proxy_hide_header X-Request-ID;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $salonai_request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    location = /ai/health {
        proxy_pass http://salonai_ai_service/health;
        proxy_http_version 1.1;

        proxy_hide_header X-Request-ID;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $salonai_request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location /ai/ {
        limit_req
            zone=salonai_api_limit
            burst=30
            nodelay;

        proxy_pass http://salonai_ai_service/;
        proxy_http_version 1.1;

        proxy_hide_header X-Request-ID;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $salonai_request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_buffering off;
    }

    location / {
        proxy_pass http://salonai_frontend;
        proxy_http_version 1.1;

        proxy_hide_header X-Request-ID;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $salonai_request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}