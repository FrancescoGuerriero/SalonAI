user nginx;

worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $salonai_request_id {
        "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
        default $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    log_format salonai_json escape=json
        '{'
          '"timestamp":"$time_iso8601",'
          '"level":"info",'
          '"service":"salonai-edge",'
          '"event":"http.request.completed",'
          '"requestId":"$salonai_request_id",'
          '"traceparent":"$http_traceparent",'
          '"remoteAddress":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"protocol":"$server_protocol",'
          '"statusCode":$status,'
          '"bytesSent":$body_bytes_sent,'
          '"requestLength":$request_length,'
          '"requestTimeSeconds":$request_time,'
          '"upstreamAddress":"$upstream_addr",'
          '"upstreamStatus":"$upstream_status",'
          '"upstreamTimeSeconds":"$upstream_response_time",'
          '"referer":"$http_referer",'
          '"userAgent":"$http_user_agent"'
        '}';

    access_log /dev/stdout salonai_json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    server_tokens off;

    client_max_body_size 10m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 30s;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    limit_req_zone
        $binary_remote_addr
        zone=salonai_api_limit:10m
        rate=30r/s;

    limit_req_zone
        $binary_remote_addr
        zone=salonai_auth_limit:10m
        rate=5r/s;

    include /etc/nginx/conf.d/*.conf;
}